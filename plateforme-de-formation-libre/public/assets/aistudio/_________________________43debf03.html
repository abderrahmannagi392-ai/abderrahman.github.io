<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المواد والتخصصات الرسمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#fff;--ink:#3d3d3d;--lbl:#3d3d3d;--mute:#8a8a8a;--g:#a4c93a;--g2:#bcdc6a;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d1a;--ink:#e6e6e2;--lbl:#e6e6e2;--mute:#9a9a95;--card:#1b1d1a}}
:root[data-theme="dark"]{--bg:#1b1d1a;--ink:#e6e6e2;--lbl:#e6e6e2;--mute:#9a9a95;--card:#1b1d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--lbl);font-family:"Noto Naskh Arabic","Droid Arabic Naskh",Tahoma,sans-serif;min-height:100vh;display:flex;align-items:center}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:40px 24px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:56px}
.head h2{margin:0;color:var(--g);font-size:20px;font-weight:700}
.head a{color:var(--mute);font-size:12px;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:24px}
.item{display:flex;flex-direction:column;align-items:center;gap:18px;color:inherit;text-decoration:none;cursor:pointer;opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*110ms)}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
.ring{width:136px;height:136px}
.ring svg{width:100%;height:100%;overflow:visible}
.ring .c{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.ring .p{fill:none;stroke:var(--g);stroke-width:2.4;stroke-dasharray:302;stroke-dashoffset:302;transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dashoffset .8s ease}
.item:hover .p,.item:focus-visible .p{stroke-dashoffset:0}
.item:focus-visible{outline:2px solid var(--g);outline-offset:8px;border-radius:12px}
.s{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.f{fill:var(--g);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.d{fill:var(--ink)}
.lbl{font-weight:400;font-size:14px;text-align:center;line-height:1.4}
svg *{transform-box:fill-box}
/* العربية */
.quill{transform-origin:20% 90%;animation:write 3.2s ease-in-out infinite}
@keyframes write{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg) translateX(-2px)}60%{transform:rotate(5deg)}}
.ln{stroke-dasharray:30;animation:draw 3.2s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:30}60%,100%{stroke-dashoffset:0}}
/* الرياضيات */
.k{transform-origin:center;animation:key 3s ease-in-out infinite;animation-delay:calc(var(--k)*160ms)}
@keyframes key{0%,60%,100%{transform:scale(1)}30%{transform:scale(1.6)}}
.scr{animation:scr 3s ease-in-out infinite}
@keyframes scr{0%,100%{opacity:1}50%{opacity:.5}}
/* العلوم */
.wave{animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
.bub{animation:bub 2.6s ease-in infinite;animation-delay:calc(var(--k)*700ms);opacity:0}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.flask{transform-origin:50% 100%;animation:tilt 5s ease-in-out infinite}
@keyframes tilt{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-4deg)}90%{transform:rotate(3deg)}}
/* الإسلامية */
.moon{animation:moon 4s ease-in-out infinite}
@keyframes moon{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-8deg)}}
.star{transform-origin:center;animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.4);opacity:.5}}
.pg{transform-origin:50% 100%;animation:pg 4s ease-in-out infinite}
@keyframes pg{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.05)}}
/* علوم التربية */
.cap{animation:cap 3.6s ease-in-out infinite}
@keyframes cap{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-6px) rotate(-3deg)}}
.tas{transform-origin:50% 0;animation:tas 1.8s ease-in-out infinite}
@keyframes tas{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
/* علم النفس */
.gear{transform-origin:center;animation:gear 8s linear infinite}
@keyframes gear{to{transform:rotate(360deg)}}
.item:hover .gear{animation-duration:2s}
.item:hover .k,.item:hover .bub,.item:hover .quill,.item:hover .moon,.item:hover .cap{animation-duration:1.1s}
.sec{margin-bottom:80px}
.g8{grid-template-columns:repeat(8,1fr);gap:16px}
.g8 .ring{width:112px;height:112px}
.g8 .lbl{font-size:13px}
/* طرائق التدريس */
.ptr{transform-origin:0% 100%;animation:ptr 3s ease-in-out infinite}
@keyframes ptr{0%,100%{transform:rotate(0)}40%{transform:rotate(-14deg)}70%{transform:rotate(6deg)}}
/* التخطيط */
.chk{stroke-dasharray:14;animation:chk 4s ease-in-out infinite;animation-delay:calc(var(--k)*500ms)}
@keyframes chk{0%{stroke-dashoffset:14}25%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:14}}
/* إدارة القسم */
.nd{transform-origin:center;animation:nd 3s ease-in-out infinite;animation-delay:calc(var(--k)*300ms)}
@keyframes nd{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-3px)}}
.nl{stroke-dasharray:40;animation:draw2 3s ease-in-out infinite}
@keyframes draw2{0%{stroke-dashoffset:40}40%,100%{stroke-dashoffset:0}}
/* التقويم والقياس */
.ndl{transform-origin:0% 100%;animation:ndl 3.6s ease-in-out infinite}
@keyframes ndl{0%,100%{transform:rotate(-50deg)}35%{transform:rotate(35deg)}55%{transform:rotate(20deg)}75%{transform:rotate(30deg)}}
.item:hover .ptr,.item:hover .ndl,.item:hover .nd{animation-duration:1.2s}
@media (max-width:900px){.g8{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr);row-gap:44px}}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}.ring{width:112px;height:112px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.item{opacity:1}.ln{stroke-dashoffset:0}}
</style>
</head>
<body>
<main class="wrap">
  <section class="sec">
  <div class="head"><h2>دروس مكثفة في الأضواء</h2><a href="#more">مشاهدة المزيد »</a></div>
  <div class="grid g8" id="top">

    <a class="item" data-k="assess" href="#assess">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <path class="s" d="M22 68a28 28 0 0 1 56 0"/><path class="s" d="M22 68a28 28 0 0 1 8-20" style="stroke:var(--g);stroke-width:5"/>
        <path class="s" d="M50 36v4M30 44l3 3M70 44l-3 3"/>
        <path class="s ndl" d="M50 68L66 46"/><circle class="f" cx="50" cy="68" r="4"/><path class="s" d="M20 76h60"/>
      </svg></div><span class="lbl">التقويم والقياس</span></a>

    <a class="item" data-k="dept" href="#dept">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <path class="s nl" d="M50 36v8M28 44h44M28 44v8M50 44v8M72 44v8"/>
        <rect class="f nd" style="--k:0" x="39" y="24" width="22" height="12" rx="3"/>
        <rect class="s nd" style="--k:1" x="17" y="52" width="22" height="12" rx="3"/><rect class="s nd" style="--k:2" x="39" y="52" width="22" height="12" rx="3"/><rect class="s nd" style="--k:3" x="61" y="52" width="22" height="12" rx="3"/>
        <path class="s" d="M20 76h60"/>
      </svg></div><span class="lbl">إدارة القسم</span></a>

    <a class="item" data-k="plan" href="#plan">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <rect class="s" x="30" y="24" width="40" height="54" rx="4"/><rect class="f" x="40" y="18" width="20" height="10" rx="3"/>
        <path class="s chk" style="--k:0" d="M36 42l3 3 5-6"/><path class="s" d="M50 42h14"/>
        <path class="s chk" style="--k:1" d="M36 54l3 3 5-6"/><path class="s" d="M50 54h14"/>
        <path class="s chk" style="--k:2" d="M36 66l3 3 5-6"/><path class="s" d="M50 66h14"/>
      </svg></div><span class="lbl">التخطيط التربوي</span></a>

    <a class="item" data-k="methods" href="#methods">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <rect class="s" x="22" y="26" width="48" height="34" rx="3"/>
        <rect class="f" x="28" y="44" width="10" height="10"/><path class="s ln" d="M28 34h28M44 44h18"/>
        <path class="s" d="M38 60l-6 16M54 60l6 16"/>
        <path class="s ptr" d="M82 34L66 52"/>
      </svg></div><span class="lbl">طرائق التدريس</span></a>

  </div>
  </section>
  <div class="head"><h2>المواد والتخصصات الرسمية</h2><a href="#more">مشاهدة المزيد »</a></div>
  <div class="grid">

    <a class="item" style="--i:0" href="#arabic">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <rect class="s" x="28" y="54" width="22" height="20" rx="3"/><rect class="f" x="32" y="46" width="14" height="8" rx="2"/>
        <g class="quill"><path class="s" d="M62 22c8 4 9 20-4 34-3-14-3-24 4-34z"/><path class="s" d="M58 56l-6 8"/></g>
        <path class="s" d="M20 78h62"/><path class="s ln" d="M56 74q4-5 8 0t8 0"/>
      </svg></div><span class="lbl">اللغة العربية</span></a>

    <a class="item" style="--i:1" href="#math">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <rect class="s" x="32" y="22" width="36" height="56" rx="5"/>
        <rect class="f scr" x="38" y="28" width="24" height="10" rx="2"/>
        <g><circle class="d k" style="--k:0" cx="40" cy="48" r="2.4"/><circle class="d k" style="--k:1" cx="50" cy="48" r="2.4"/><circle class="d k" style="--k:2" cx="60" cy="48" r="2.4"/>
        <circle class="d k" style="--k:3" cx="40" cy="58" r="2.4"/><circle class="d k" style="--k:4" cx="50" cy="58" r="2.4"/><circle class="d k" style="--k:5" cx="60" cy="58" r="2.4"/>
        <circle class="d k" style="--k:6" cx="40" cy="68" r="2.4"/><circle class="d k" style="--k:7" cx="50" cy="68" r="2.4"/><circle class="k" style="--k:8;fill:var(--g)" cx="60" cy="68" r="2.8"/></g>
      </svg></div><span class="lbl">الرياضيات</span></a>

    <a class="item" style="--i:2" href="#science">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <defs><clipPath id="fl"><path d="M45 40L30 68q-3 8 5 8h30q8 0 5-8L55 40z"/></clipPath></defs>
        <g class="flask">
          <g clip-path="url(#fl)"><g class="wave"><rect class="f" x="22" y="58" width="56" height="24" style="stroke:none"/></g></g>
          <path class="s" d="M42 22h16M45 22v18L30 68q-3 8 5 8h30q8 0 5-8L55 40V22"/>
        </g>
        <circle class="s bub" style="--k:0" cx="46" cy="52" r="2.4"/><circle class="s bub" style="--k:1" cx="54" cy="48" r="2"/><circle class="s bub" style="--k:2" cx="50" cy="44" r="1.8"/>
      </svg></div><span class="lbl">العلوم الطبيعية</span></a>

    <a class="item" style="--i:3" href="#islamic">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <g class="moon"><path class="f" d="M46 20a12 12 0 1 0 12 19 10 10 0 1 1-12-19z"/></g>
        <path class="f star" d="M64 26l2 4 4 .6-3 3 .8 4-3.8-2-3.8 2 .8-4-3-3 4-.6z" style="stroke-width:1.6"/>
        <g class="pg"><path class="s" d="M20 74c10-4 22-4 30 2 8-6 20-6 30-2V50c-10-4-22-4-30 2-8-6-20-6-30-2z"/><path class="s" d="M50 52v24"/>
        <path class="s" d="M27 58c6-1 12-1 17 1M27 66c6-1 12-1 17 1M56 59c5-2 11-2 17-1M56 67c5-2 11-2 17-1"/></g>
      </svg></div><span class="lbl">التربية الإسلامية</span></a>

    <a class="item" style="--i:4" href="#education">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <path class="s" d="M32 52v14c6 8 30 8 36 0V52"/>
        <g class="cap"><path class="f" d="M50 28L82 42 50 56 18 42z"/>
        <g class="tas"><path class="s" d="M78 44v18"/><circle class="f" cx="78" cy="65" r="3.4"/></g></g>
      </svg></div><span class="lbl">علوم التربية</span></a>

    <a class="item" style="--i:5" href="#psych">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/>
        <path class="s" d="M42 78V66c-8-4-12-12-12-22 0-14 10-22 24-22s20 8 20 20c0 6-2 8-4 12l4 4-4 2v6c0 4-4 6-8 6z"/>
        <g class="gear"><circle class="f" cx="52" cy="44" r="7"/><path class="s" d="M52 33v-3M52 55v3M41 44h-3M63 44h3M44 36l-2-2M60 52l2 2M60 36l2-2M44 52l-2 2"/></g>
      </svg></div><span class="lbl">علم النفس التربوي</span></a>

  </div>
</main>
<script>
(function(){
  var g=document.getElementById('top'),n={};
  g.querySelectorAll('.item').forEach(function(e){n[e.dataset.k]=e});
  ['arabic','education','psych','assess','islamic','dept','plan','methods'].forEach(function(k,i){
    var e=n[k]||document.querySelector('a.item[href="#'+k+'"]').cloneNode(true);
    e.style.setProperty('--i',i);g.appendChild(e);
  });
})();
</script>
</body>
</html>
