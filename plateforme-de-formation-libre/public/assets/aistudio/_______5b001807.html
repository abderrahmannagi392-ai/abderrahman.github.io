<div class="app" id="app"></div>
<!-- ============ نسخة الهاتف (من Google AI Studio) ============
     تظهر فقط على الشاشات الصغيرة (760px فما دون) بعد تسجيل الدخول.
     1) ألصق CSS في <style id="mobile-style"> أدناه
     2) ألصق HTML داخل <div id="mobile-app-root">
     3) ألصق JS داخل <script id="mobile-script"> (استخدم نفس localStorage: مفاتيح tdr_user و tdr_auth و tdr2_<البريد>)
     لتسجيل الخروج من نسخة الهاتف: localStorage.removeItem('tdr_auth'); location.reload();
     ============================================================ -->
<div id="mobile-slot">
<style id="mobile-style">
/* ألصق CSS نسخة الهاتف هنا */
</style>
<div id="mobile-app-root">
<div class="ms-ph"><div><b style="font-size:18px;color:var(--ink)">نسخة الهاتف قيد الإضافة</b><p>هذا المكان جاهز لوضع واجهة الهاتف.</p></div></div>
</div>
<script id="mobile-script">
/* ألصق JS نسخة الهاتف هنا */
</script>
</div><div id="modal"></div><div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},app=$('app');
function st(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
